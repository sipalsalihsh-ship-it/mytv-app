<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 12px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            color: #e50914;
            font-size: 24px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        video, iframe {
            width: 100%;
            height: 250px;
            border: none;
            display: block;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .channel-card.active {
            border-color: #e50914;
            background: #e50914;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport</h1>
    </div>

    <div class="player-container" id="playerBox">
        <video id="video" controls playsinline muted></video>
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      // beIN Sports قاناللىرى ئۇلىنىشى
      const sportsChannels = [
        { name: "beIN Sports News", type: "hls", url: "https://corsproxy.io/?" + encodeURIComponent("https://beinsports.akamaized.net/hls/live/2034053/beinnews/master.m3u8") },
        { name: "beIN Sports 1", type: "iframe", url: "https://vsn.live/embed/bein1.php" },
        { name: "Test Stream HD", type: "hls", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
      ];

      const playerBox = document.getElementById('playerBox');
      let hls = null;

      function playChannel(ch, element) {
        document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        if (ch.type === "iframe") {
          if (hls) hls.destroy();
          playerBox.innerHTML = <iframe src="${ch.url}" allowfullscreen scrolling="no"></iframe>;
        } else {
          playerBox.innerHTML = <video id="video" controls playsinline muted></video>;
          const video = document.getElementById('video');

          if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              video.play().catch(e => console.log(e));
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = ch.url;
            video.play();
          }
        }
      }

      const channelGrid = document.getElementById('channelGrid');
      sportsChannels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerText = ch.name;
        card.onclick = () => playChannel(ch, card);
        channelGrid.appendChild(card);

        if (index === 0) playChannel(ch, card);
      });
    </script>

</body>
</html>
