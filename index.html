<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 12px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 10px 0;
            color: #e50914;
            font-size: 24px;
        }

        .download-btn {
            display: inline-block;
            background-color: #e50914;
            color: #ffffff;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .channel-card.active {
            border-color: #e50914;
            background: #e50914;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport</h1>
        <a href="mytv.apk" class="download-btn" download>📲 داونلۆدکردنی APK</a>
    </div>

    <div class="player-container">
        <video id="video" controls playsinline muted></video>
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      // بەستەری کەناڵە بەهێزەکان
      const sportsChannels = [
        { name: "Test Stream 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
        { name: "Bahrain Sport", url: "https://5c7b683162943.streamlock.net/live/ngrp:sportsone_all/playlist.m3u8" },
        { name: "Sample MP4", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
      ];

      const video = document.getElementById('video');
      const channelGrid = document.getElementById('channelGrid');
      let hls = null;

      function playChannel(url, element) {
        document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        if (url.endsWith('.m3u8')) {
          if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              video.play();
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
          }
        } else {
          if (hls) hls.destroy();
          video.src = url;
          video.play();
        }
      }

      sportsChannels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = ch.name;
        card.onclick = () => playChannel(ch.url, card);
        channelGrid.appendChild(card);

        if (index === 0) playChannel(ch.url, card);
      });
    </script>

</body>
</html>
