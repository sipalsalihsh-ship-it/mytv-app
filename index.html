<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 15px;
        }
        .header {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .header h1 { color: #e50914; font-size: 22px; }
        .player-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }
        video { width: 100%; height: 100%; display: block; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.active { background: #e50914; border-color: #e50914; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport</h1>
    </div>

    <div class="player-container">
        <video id="video" controls playsinline muted></video>
    </div>

    <div class="grid" id="channelGrid"></div>

    <script>
      const channels = [
        { name: "Test Stream 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
        { name: "Test Stream 2", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
      ];

      const video = document.getElementById('video');
      const grid = document.getElementById('channelGrid');
      let hls = null;

      function play(url, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        if (url.endsWith('.m3u8')) {
          if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
          }
        } else {
          if (hls) hls.destroy();
          video.src = url;
          video.play();
        }
      }

      channels.forEach((ch, i) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerText = ch.name;
        b.onclick = () => play(ch.url, b);
        grid.appendChild(b);
        if (i === 0) play(ch.url, b);
      });
    </script>

</body>
