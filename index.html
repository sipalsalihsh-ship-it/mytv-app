<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 10px;
            text-align: center;
        }

        .header {
            padding: 12px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #e50914;
            font-size: 22px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .channel-card.active {
            border-color: #e50914;
            background: #e50914;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport</h1>
    </div>

    <div class="player-container" id="playerContainer">
        <!-- Player loads here -->
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      // کەناڵەکان بە بەستەری جێگیر و ئامادەکراو
      const sportsChannels = [
        { name: "beIN Sports News", embed: "https://www.youtube.com/embed/live_stream?channel=UC4i_9M_S_e0A1P4G85y-LgQ" },
        { name: "KurdSat Sport", embed: "https://www.youtube.com/embed/live_stream?channel=UCj8-H0S_X3k0u_Kz0S21H-w" },
        { name: "Test Player", embed: "https://www.youtube.com/embed/5qap5aO4i9A" }
      ];

      const playerContainer = document.getElementById('playerContainer');
      const channelGrid = document.getElementById('channelGrid');

      function playChannel(embedUrl, element) {
        document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        playerContainer.innerHTML = <iframe src="${embedUrl}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>;
      }

      sportsChannels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerText = ch.name;
        card.onclick = () => playChannel(ch.embed, card);
        channelGrid.appendChild(card);

        if (index === 0) playChannel(ch.embed, card);
      });
    </script>

</body>
</html>
