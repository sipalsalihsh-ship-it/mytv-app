<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    <!-- Hls.js library for streaming m3u8 on all mobile browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 15px;
        }
        .header {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h1 {
            color: #ff2a2a;
            font-size: 22px;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn-channel {
            background-color: #262626;
            color: #fff;
            border: 2px solid #3a3a3a;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-channel:hover, .btn-channel:active {
            background-color: #ff2a2a;
            border-color: #ff2a2a;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MyTV+ Sport ⚽</h1>
    </div>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="channels-grid">
        <button class="btn-channel" onclick="playStream('https://top.beinsportm3u.com/beIN1/index.m3u8')">beIN Sports 1</button>
        <button class="btn-channel" onclick="playStream('https://top.beinsportm3u.com/news/index.m3u8')">beIN News</button>
        <button class="btn-channel" onclick="playStream('https://live.kurdistan24.net/k24/live/index.m3u8')">Kurdistan 24</button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        let hls;

        function playStream(url) {
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For Safari on iPhone / Mac
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                alert('پێگەڕەکەت پشتیوانیی ئەم جۆرە پەخشە ناکات!');
            }
        }

        // دەستپێکردنی بێین سپۆرت 1 وەک سەرەتایی
        playStream('https://top.beinsportm3u.com/beIN1/index.m3u8');
    </script>

</body>
</html>
