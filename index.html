<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 12px;
            background: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            color: #e50914;
            font-size: 26px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .channel-card:hover, .channel-card.active {
            border-color: #e50914;
            background: #e50914;
            transform: scale(1.03);
        }

        .channel-card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MyTV+ Sport ⚽</h1>
    </div>

    <div class="player-container">
        <video id="video" controls autoplay muted></video>
    </div>

    <!-- قائمة القنوات الرياضية -->
    <div class="channel-grid" id="channelGrid"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      // قائمة القنوات الرياضية الشغالة
      const sportsChannels = [
        { id: 1, name: "Sport Stream 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
        { id: 2, name: "Sport Stream 2", url: "https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8" },
        { id: 3, name: "RedBull Sport", url: "https://rbmn-live.akamaized.net/hls/live/590929/FLOSPORTS/master.m3u8" }
      ];

      const video = document.getElementById('video');
      const channelGrid = document.getElementById('channelGrid');
      let hls = null;

      function playChannel(url, element) {
        document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log("Autoplay issue: ", e));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.play();
        }
      }

      function renderChannels() {
        channelGrid.innerHTML = '';
        sportsChannels.forEach((ch, index) => {
          const card = document.createElement('div');
          card.className = 'channel-card';
          card.innerHTML = <p>${ch.name}</p>;
          card.onclick = () => playChannel(ch.url, card);
          channelGrid.appendChild(card);

          if (index === 0) playChannel(ch.url, card);
        });
      }

      renderChannels();
    </script>

</body>
</html>
