<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 10px;
        }
        .header {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .header h1 { color: #e50914; font-size: 20px; }
        .player-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.active { background: #e50914; border-color: #e50914; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport</h1>
    </div>

    <div class="player-container" id="playerContainer">
        <!-- Iframe player loads here -->
    </div>

    <div class="grid" id="channelGrid"></div>

    <script>
      const channels = [
        { 
          name: "beIN News Live", 
          url: "https://www.youtube.com/embed/live_stream?channel=UC4i_9M_S_e0A1P4G85y-LgQ" 
        },
        { 
          name: "beIN Sports 1", 
          url: "https://vidsrc.me/embed/tv" 
        }
      ];

      const playerContainer = document.getElementById('playerContainer');
      const grid = document.getElementById('channelGrid');

      function playChannel(url, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        playerContainer.innerHTML = <iframe src="${url}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>;
      }

      channels.forEach((ch, i) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerText = ch.name;
        b.onclick = () => playChannel(ch.url, b);
        grid.appendChild(b);
        if (i === 0) playChannel(ch.url, b);
      });
    </script>

</body>
</html>
