<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV App</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #e50914; }
        .player {
            width: 80%;
            max-width: 600px;
            height: 300px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <h1>MyTV Channel</h1>
    <div class="player">
        <p>بەخشێ زەندو ل ڤێرە دێ دیار بیت...</p>
    </div>
</body>
</html>
