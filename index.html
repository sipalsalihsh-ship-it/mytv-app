<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV+ Sport</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyTV+">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 15px;
        }
        .header {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header h1 { color: #e50914; font-size: 22px; }
        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        .btn {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 14px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #2a2a2a; }
        .btn.active { background: #e50914; border-color: #e50914; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ MyTV+ Sport Live</h1>
    </div>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="grid" id="channelGrid"></div>

    <script>
      const channels = [
        { 
          name: "beIN Sports News", 
          url: "https://live.beinsports.com/hls/live/2034032/beIN_NEWS/master.m3u8" 
        },
        { 
          name: "Alkass ONE HD", 
          url: "https://alkasslive.akamaized.net/hls/live/2004245/alkass1/master.m3u8" 
        },
        { 
          name: "AD Sports 1", 
          url: "https://live.adsports.ae/hls/adsports1.m3u8" 
        }
      ];

      const video = document.getElementById('videoPlayer');
      const grid = document.getElementById('channelGrid');
      let hls = null;

      function playChannel(url, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);

          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              alert("داوای لێبوردن دەکەین، ئەم کەناڵە لە ئێستادا لە پەخش کەوتووە یان لینکەکەی تێکچووە!");
            }
          });

          hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(e => console.log("Autoplay blocked"));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.onerror = function() {
            alert("داوای لێبوردن دەکەین، ئەم کەناڵە لە ئێستادا لە پەخش کەوتووە!");
          };
          video.addEventListener('loadedmetadata', function() {
            video.play();
          });
        }
      }

      channels.forEach((ch, index) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerText = ch.name;
        b.onclick = () => playChannel(ch.url, b);
        grid.appendChild(b);
        
        if (index === 0) playChannel(ch.url, b);
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch(err => console.log('SW Registration Failed:', err));
      }
    </script>

</body>
</html>
